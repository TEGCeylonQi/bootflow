# BootFlow 发布流水线
#
# 触发方式：推一个版本 tag。发布一个新版本就三步——
#
#   # 1. 先把版本号改进 tauri.conf.json（"version": "0.2.0"）
#   # 2. 提交
#   git commit -am "chore: 版本号 0.2.0"
#   # 3. 打 tag 并推上去（tag 名必须以 v 开头）
#   git tag v0.2.0
#   git push origin main --tags
#
# 然后这个 workflow 会自动构建出安装包、创建 Release、把产物挂上去。
# 不需要在本地构建，也不需要在网页上手动传文件。
#
# 为什么用 tag 触发而不是「推 main 就发版」：
# 发布是个有外部影响、且会被别人下载到的动作，必须由人明确决定。
# 推 main 是日常动作，天天发生；打 tag 是有意识的动作。
#
# 这个 workflow 的产物与 CI 是分开的：
#   - ci.yml    每次推 main / PR 都跑，只做检查，不产出可下载的东西
#   - release.yml 只在打 tag 时跑，构建真正的发布产物
name: Release

on:
  push:
    tags:
      - 'v*'

# tauri-action 需要创建 Release 并上传附件，这属于「写仓库内容」。
# 不声明的话 GITHUB_TOKEN 只有只读权限，会在最后一步失败。
permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      # 这一步做四件事：跑 `npm run build` 出前端产物 → 编译 Rust release →
      # 用 NSIS 打包 → 创建 Release 并把安装包作为附件传上去。
      #
      # `tagName: v__VERSION__` 中的 __VERSION__ 会被替换成 tauri.conf.json
      # 里的 version。所以**改版本号只需要改那一个地方**，tag 名会自动对上。
      # 如果 tag 已经存在（我们就是先打的 tag），它会用那个 tag 建 release。
      #
      # Release 正文在这里只给一个简短的占位（防止中间失败时发布页是空的），
      # 真正的正文——「本版本更新」+ 完整下载说明——由下一步
      # `tools/release-notes.mjs` 从 RELEASE_NOTES.md 现取并覆盖。
      - name: 构建并发布
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'BootFlow v__VERSION__'
          # 占位正文；别在这里维护长文案了，发布日志的权威来源是 RELEASE_NOTES.md
          releaseBody: |
            BootFlow v__VERSION__ 已发布，本版本更新内容见下方「本版本更新」。
          releaseDraft: false
          prerelease: false

      # 用发布日志覆盖 Release 正文：从 RELEASE_NOTES.md 取当前版本的
      # 「本版本更新」段，拼上通用介绍，写入发布页。
      #
      # 更新日志的权威来源是发布页，README 只留大版本路线。
      # 找不到当前版本的段落时脚本会报错退出，让 CI 失败而不是发个空日志。
      - name: 更新发布页正文为本版本更新日志
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release-notes.mjs "${{ github.ref_name }}"

      # 便携版：把编译出的 exe 单独打包成 zip。
      #
      # 为什么不直接用 tauri-action 的 `uploadPlainBinary`：那个选项的官方注释
      # 明确写着「Tauri 并不官方支持便携模式」，且要求配合 `--no-bundle` 使用，
      # 会牵动 updater 的 bundle_type 判定。我们自己压一个 zip 更直白，
      # 也让发布产物保持「安装包 + 便携包」两种，与计划 §10 一致。
      #
      # ⚠️ 便携版的 exe 依然需要 WebView2 运行时，这一点在 Release 正文里已说明。
      - name: 打包便携版并挂到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Compress-Archive `
            -Path src-tauri/target/release/bootflow.exe `
            -DestinationPath bootflow-portable-x64.zip `
            -Force
          gh release upload "${{ github.ref_name }}" bootflow-portable-x64.zip --clobber
          Write-Host "便携版已上传：$(Get-Item bootflow-portable-x64.zip | Select-Object -ExpandProperty Length) 字节"
