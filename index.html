<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BootFlow — 启动项编排</title>
    <!--
      内联 SVG 图标，不额外引文件。
      三条由长到短的横条＝启动序列，颜色由蓝到紫再到绿：
      从"现状"（蓝）经过"你的编排"（紫）到达"就绪"（绿）。
      顺带消掉浏览器对 /favicon.ico 的默认请求（那会是一条永远存在的 404）。
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161b22'/%3E%3Crect x='7' y='8' width='18' height='3' rx='1.5' fill='%2358a6ff'/%3E%3Crect x='7' y='14.5' width='12' height='3' rx='1.5' fill='%23a371f7'/%3E%3Crect x='7' y='21' width='7' height='3' rx='1.5' fill='%233fb950'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
